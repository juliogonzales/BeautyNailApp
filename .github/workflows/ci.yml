name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  app:
    name: App (lint, testes, build, typecheck)
    runs-on: ubuntu-latest
    env:
      # Valores de mentira só para compilar; o app real usa as variáveis da Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key-0000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Usa `npm ci` quando o package-lock.json existir (workflow "Gerar package-lock.json").
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  database:
    name: Banco (RLS A x B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Inicializa config local (se faltar) e sobe o Supabase
        run: |
          [ -f supabase/config.toml ] || supabase init
          supabase start
      - name: Aplica migrations do zero
        run: supabase db reset
      - name: Roda os testes de isolamento (fundação e Fase 2)
        # Cada teste termina com um erro proposital que desfaz tudo e imprime "PASS=n, FAIL=m";
        # por isso a conferência é pelo texto, não pelo código de saída do psql.
        run: |
          for f in supabase/tests/rls_isolation.sql supabase/tests/rls_isolation_phase2.sql; do
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f "$f" > resultado.txt 2>&1 || true
            cat resultado.txt
            if ! grep -Eq "RESULTADOS \(rollback automático: PASS=[1-9][0-9]*, FAIL=0\)" resultado.txt; then
              echo "::error::$f tem falhas ou não terminou"
              exit 1
            fi
          done
